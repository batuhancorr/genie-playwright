name: Playwright (guest)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guest-tests:
    # Giris gerektiren testler oturum dosyasi istedigi icin CI'da yalnizca misafir testleri kosulur.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=guest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
